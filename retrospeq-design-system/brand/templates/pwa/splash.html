<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><title>splash</title><link rel="stylesheet" href="../../css/index.css"><style>
html,body{margin:0;background:#fff}.canvas{width:1170px;height:2532px;background:var(--rq-bg);color:var(--rq-ink);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:0px;box-sizing:border-box;font-family:var(--rq-font-sans)}
.brand{display:flex;align-items:center;gap:16px;font-weight:var(--rq-weight-display);letter-spacing:var(--rq-track-display);font-size:48px}.brand svg{width:48px;height:48px}
.big{font-weight:var(--rq-weight-display);letter-spacing:var(--rq-track-display);line-height:.96;text-wrap:balance;margin:0}.big .thin{font-weight:var(--rq-weight-thin);color:var(--rq-ink-soft)}
.sub{color:var(--rq-ink-soft);line-height:1.4;margin:0}.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--rq-font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--rq-ink-faint)}
.canvas{align-items:center;justify-content:center;gap:28px}</style></head><body><div class="canvas"><svg width="160" height="160" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11.25" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="19.8" cy="19" r="3.3" fill="var(--rq-accent)"/></svg><p class="big" style="font-size:56px">Retrospe<span style="color:var(--rq-accent)">q</span></p><p class="rq-label" style="font-size:18px">Was this a good decision?</p></div></body></html>
